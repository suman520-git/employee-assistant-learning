name: Employee Assistant CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    env:
      ECR_REPOSITORY: 458013564538.dkr.ecr.ap-south-1.amazonaws.com/employee-assistant
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Download repository code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run basic tests
        run: python -m unittest discover -s tests -v

      - name: Build Docker image
        run: docker build -t "$ECR_REPOSITORY:$IMAGE_TAG" .

      - name: Check GitHub identity
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: python
        run: |
          import os
          import json
          import base64
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          url += "&audience=sts.amazonaws.com"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              },
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print("Subject:", claims["sub"])
          print("Audience:", claims["aud"])

      - name: Authenticate with AWS
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::458013564538:role/employee-assistant-github-role
          aws-region: ap-south-1

      - name: Log Docker into ECR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker push "$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Show uploaded image address
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: echo "$ECR_REPOSITORY:$IMAGE_TAG"